<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malak</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .lock-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            font-size: 15px;
            color: #d1d5db;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: #ff758c;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.4);
        }

        button.btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.3);
            transition: all 0.3s ease;
        }

        button.btn-login:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }

        #main-content {
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-title {
            font-size: 28px;
            color: #ff7eb3;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .content-box {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.8;
            color: #f3f4f6;
        }
    </style>
</head>
<body>

    <!-- صفحة طلب كلمة السر -->
    <div class="card" id="lock-screen">
        <div class="lock-icon">🔒</div>
        <h2>مرحباً يا ملك ✨</h2>
        <p>اكتبي كلمة السر عشان تفتحي المفاجأة 💖</p>
        
        <div class="input-group">
            <input type="password" id="password-input" placeholder="ادخلي كلمة السر هنا...">
        </div>
        
        <button class="btn-login" onclick="checkPassword()">دخول ✨</button>
        <div class="error-msg" id="error-msg">❌ كلمة السر غير صحيحة، حاولي تاني!</div>
    </div>

    <!-- المحتوى الأصلي للموقع بيظهر بعد كتابة كلمة السر صح -->
    <div class="card" id="main-content">
        <div class="welcome-title">❤️ أهلاً يا ملك ❤️</div>
        <div class="content-box">
            تم فتح الصفحة بنجاح! 🎉<br>
            المفاجأة والرسالة الخاصة بيكي جاهزة هنا! ✨
        </div>
    </div>

    <script>
        function checkPassword() {
            const passwordInput = document.getElementById('password-input').value;
            const lockScreen = document.getElementById('lock-screen');
            const mainContent = document.getElementById('main-content');
            const errorMsg = document.getElementById('error-msg');

            // كلمة السر المحددة
            if (passwordInput === 'malouka') {
                lockScreen.style.display = 'none';
                mainContent.style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
                document.getElementById('password-input').focus();
            }
        }

        // إمكانية الضغط على Enter للدخول
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
